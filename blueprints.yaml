name: Quark 2 Open Publishing
type: theme
slug: quark2-open-publishing
version: 0.9.0
description: "A Quark 2 version of Quark Open Publishing, for open guides and blogs: guides with section cards, parts and reading progress, alongside a full blog. Uses the same pages and settings as Quark Open Publishing."
icon: unlock
author:
    name: HibbittsDesign.org
    email: hello@hibbittsdesign.org
    url: https://hibbittsdesign.org
homepage: https://github.com/hibbitts-design/grav-theme-quark2-open-publishing
docs: https://github.com/hibbitts-design/grav-theme-quark2-open-publishing#readme
bugs: https://github.com/hibbitts-design/grav-theme-quark2-open-publishing/issues
keywords: open, guide, blog, oer, gitsync, chromeless, quark2
license: MIT
compatibility:
  grav: ['2.1']

dependencies:
  - { name: grav, version: '>=2.1.0' }
  - quark2

form:
  validation: loose
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        general_info:
          type: tab
          title: 'Open Publishing Options'
          fields:
            chromelessoptions:
              type: section
              title: 'Chromeless Site (i.e. Embedded)'
              underline: true
            chromeless.enabled:
              type: toggle
              label: 'Hide Site Menu, Sidebar and Footer'
              highlight: 1
              default: 0
              options:
                '0': No
                '1': Yes
              validate:
                type: bool
            h5psetup:
              type: section
              title: 'H5P Setup'
              underline: true
            h5pembedrootpath:
              type: text
              size: long
              label: 'H5P Embed Source URL'
              default: 'https://h5p.org/h5p/embed/'
              help: 'Enter the embed source URL path up to, but not including, the H5P Content ID.'
              description: 'H5P embed source URL path up to, but not including, the Content ID. For example, ''https://h5p.org/h5p/embed/'' or ''https://[organization].h5p.com/content/''.'
              validate:
                type: URL
            displaycclicense:
              type: section
              title: 'Creative Commons License'
              underline: true
              fields:
                cc_license.enabled:
                  type: toggle
                  label: 'Display CC License'
                  highlight: 1
                  default: 0
                  options:
                    '0': No
                    '1': Yes
                  validate:
                    type: bool
                cc_license.type:
                  type: select
                  label: 'CC License Type'
                  default: ccby
                  size: long
                  description: 'Looking for more info about Creative Commons (CC) Licenses?<br> Visit the <a href="https://creativecommons.org/" target="_blank">creativecommons.org</a> site.'
                  options:
                    ccby: 'CC Attribution'
                    ccbysa: 'CC Attribution Share Alike'
                    ccbynd: 'CC Attribution No Derivatives'
                    ccbync: 'CC Attribution Non-Commercial'
                    ccbyncsa: 'CC Attribution Non-Commercial Share Alike'
                    ccbyncnd: 'CC Attribution Non-Commercial No Derivatives'
                cc_license.icon:
                  type: toggle
                  label: 'Display Only CC License Icon'
                  highlight: 1
                  default: 0
                  options:
                    '0': No
                    '1': Yes
                  validate:
                    type: bool
                cc_license.text:
                  type: text
                  size: long
                  description: 'For example, ''except where otherwise noted.'''
                  label: 'Additional CC License Text'
                  validate:
                    type: text
            menuoptions:
              type: section
              title: Menu
              underline: true
            dropdown.enabled:
              type: toggle
              label: 'Display Dropdowns in Menu'
              highlight: 1
              default: 1
              options:
                '0': Disabled
                '1': Enabled
              validate:
                type: bool
        quark2_info:
          type: tab
          title: 'Quark 2 Options'
          fields:
            theme-mode:
              type: select
              label: Theme Mode Default
              help: Default appearance before a user makes a choice. Users can still toggle in the UI.
              size: small
              default: auto
              options:
                auto: Auto (follows OS)
                light: Light
                dark: Dark

            accent-color:
              type: colorpicker
              label: Accent Color
              help: Tints links and focus rings. Leave blank for the pure monochrome palette.
              default: '#242424'

            header_section:
              type: section
              title: Header
              underline: true

            custom_logo:
              type: file
              label: Custom Logo
              help: Saved to user/themes/quark2/images/logo. The file stays put across theme updates.
              size: large
              destination: 'theme://images/logo'
              multiple: false
              markdown: true
              accept:
                - image/*

            custom_logo_mobile:
              type: file
              label: Custom Logo (Mobile)
              help: Saved to user/themes/quark2/images/logo. The file stays put across theme updates.
              size: large
              destination: 'theme://images/logo'
              multiple: false
              accept:
                - image/*

            custom_favicon:
              type: file
              label: Custom Favicon
              help: A PNG, SVG or ICO file, 100 KB at most. Saved to user/themes/quark2/images/favicon. The file stays put across theme updates.
              filesize: 0.1
              size: large
              destination: 'theme://images/favicon'
              multiple: false
              accept:
                - image/png
                - image/svg+xml
                - .ico

            header-fixed:
              type: toggle
              label: Header Fixed
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            header-animated:
              type: toggle
              label: Header Animated
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            header-transparent:
              type: toggle
              label: Header Transparent (hero pages)
              help: Lets the hero show through the header until the visitor scrolls.
              highlight: 0
              default: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            header-dark:
              type: toggle
              label: Header Text Light
              help: Draws the header text in white while it sits over a dark hero image.
              highlight: 0
              default: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            header-light:
              type: toggle
              label: Header Text Dark
              help: Draws the header text in near-black while it sits over a light hero image.
              highlight: 0
              default: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            footer_section:
              type: section
              title: Footer
              underline: true

            sticky-footer:
              type: toggle
              label: Sticky Footer
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            blog_section:
              type: section
              title: Blog
              underline: true

            blog-page:
              type: text
              label: Blog Page Route
              size: medium
              default: '/blog'

            icons_section:
              type: section
              title: Icons
              underline: true

            fontawesome.enabled:
              type: toggle
              label: Font Awesome 7
              help: Load Font Awesome 7 free icon set.
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            fontawesome.local:
              type: toggle
              label: Serve Font Awesome locally
              help: When enabled, expects `css/fontawesome/all.min.css` to exist in the theme. Otherwise uses the official CDN.
              highlight: 0
              default: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            phone_text_size:
              type: select
              label: 'Text Size on Phones'
              help: 'Kept so settings from Quark Open Publishing stay valid. Quark 2 already uses a comfortable text size on phones (16px), so this setting has no effect here.'
              size: medium
              default: standard
              options:
                standard: 'Standard'
                larger: 'Larger'
        custommenu_options:
          type: tab
          title: 'Custom Menu Items'
          fields:
            displaycustommenus.enabled:
              type: toggle
              label: 'Display Custom Menu Items'
              help: 'Determines if any defined custom menu entries are displayed in the menubar.'
              default: 0
              highlight: 1
              options:
                '0': No
                '1': Yes
              validate:
                type: bool
            menu:
              name: menu
              type: list
              label: 'Custom Menu Items'
              fields:
                .text:
                  type: text
                  label: Text
                  description: 'Text label for menu item.'
                .icon:
                  type: text
                  label: Icon
                  description: 'Font Awesome icon for menu item.'
                .url:
                  type: text
                  label: URL
                  description: 'URL for menu item.'
                .target:
                  type: select
                  label: Target
                  default: _self
                  size: medium
                  options:
                    _blank: 'Open in a new window'
                    _parent: 'Open in the parent frame'
                    _top: 'Open in the full body of the window'
                    _self: 'Open in the same frame as clicked'
        gitsynclink_options:
          type: tab
          title: 'Git Sync Link'
          fields:
            gitsyncsetup:
              type: section
              title: Setup
              underline: true
            display_of_git_sync_repo_link:
              type: select
              size: medium
              classes: fancy
              label: 'Location of Git Sync Link'
              default: menu
              options:
                menu: Menu
                page: 'Page (visible when ''Chromeless'')'
                footer: Footer
                none: None
            type_of_git_sync_repo_link:
              type: select
              size: medium
              label: 'Type of Git Sync Link'
              default: view
              options:
                view: 'View Git Repository'
                edit: 'View/Edit Page in Git Repository'
            gitsyncoptions:
              type: section
              title: Appearance
              underline: true
            custom_git_sync_repo_link_icon:
              type: input.text
              size: small
              label: 'Custom Font Awesome Icon'
              description: 'Short name, e.g. ''code-fork''.'
              validate:
                type: text
            custom_git_sync_repo_link_text:
              type: input.text
              size: long
              label: 'Custom Link Text'
              description: 'Link text, e.g. ''View Page in GitHub'' or ''View Page as Markdown''.'
              validate:
                type: text
            git_sync_edit_note_text:
              type: input.text
              size: medium
              label: 'Text before Page Link'
              description: 'The text before Git Sync Link located on a Page, e.g. ''Have a suggestion or correction?'' or ''Want to reuse this open content?''.'
            gitsyncadvanced:
              type: section
              title: Advanced
              underline: true
            git_sync_repo_link:
              type: input.url
              label: 'Custom Git Repository Tree URL'
              help: 'Enter the URL that leads to the pages folder of your Git Repository.'
              description: 'URL path to pages folder for ''View/Edit Page in Git Repository'' option, but with ''/pages'' and everything following it removed. For example, ''https://github.com/paulhibbitts/demo-grav-course-hub/tree/master''.'
              validate:
                type: URL
