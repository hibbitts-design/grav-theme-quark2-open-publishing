title: Default
'@extends':
    type: default
    context: blueprints://pages

# Standard pages: Quark 2's body classes hint, plus two menu settings on Grav's own Advanced tab, right after its
# Visible setting (ordering@ places them there)
form:
  fields:
    tabs:
      fields:
        # a Glossary on a standard page in a guide, beside its Topics or Resources pages
        options:
          fields:
            glossary_section:
              type: section
              title: Glossary
              underline: true

            header.glossary:
              type: list
              label: Glossary
              style: vertical
              collapsed: true
              btnLabel: Add Term
              help: 'Use this page as the guide''s Glossary, instead of a Glossary section: put it in the guide''s folder, like a Topics page, in an unnumbered folder so it isn''t shown as a section card. Only needed on that one page. The terms are listed in alphabetical order at the end of its text (or where you add [glossary]); in the guide''s text, [term]OER[/term] (or the Glossary Term editor button) shows a term''s definition when hovered over, tapped or chosen with the keyboard.'
              fields:
                .term:
                  type: text
                  label: Term
                .definition:
                  type: textarea
                  label: Definition
                  rows: 3

        advanced:
          fields:
            columns:
              fields:
                column1:
                   fields:
                     header.body_classes:
                       markdown: true
                       description: 'Available classes in Quark 2 (space separated):<br />`header-fixed`, `header-animated`, `header-transparent`, `sticky-footer`'
            overrides:
              fields:
                header.hide_from_menu:
                  ordering@: header.visible
                  type: toggle
                  toggleable: true
                  label: Hide from Menu
                  help: 'Leaves this page out of the site menu.'
                  highlight: 1
                  options:
                    1: PLUGIN_ADMIN.ENABLED
                    0: PLUGIN_ADMIN.DISABLED
                  validate:
                    type: bool
                header.menu_order:
                  ordering@: header.hide_from_menu
                  type: number
                  toggleable: true
                  label: Menu Order
                  size: x-small
                  min: 1
                  help: 'For a page in a guide''s folder without a number (such as Topics): its place in the menu while reading the guide, lowest first.'
                  validate:
                    type: int
