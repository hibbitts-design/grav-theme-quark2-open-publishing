title: Modules Page Options
'@extends':
    type: default
    context: blueprints://pages

# A course's Modules page (module.md, as in Grav Helios Course Hub): a card for each module; the modules are the pages
# inside it (Course Page type), read in order with Previous/Next - hibbittsdesign.org
form:
  fields:
    tabs:
      type: tabs
      active: 1

      fields:
        modules:
          type: tab
          title: Modules

          fields:

            header.description:
              type: textarea
              label: Description
              toggleable: true
              rows: 3
              help: 'Shown below the title.'

            header.learning_objectives:
              type: textarea
              label: Learning Objectives
              toggleable: true
              rows: 4
              help: 'Shown as a Learning Objectives box. Supports Markdown.'

            header.content.items:
              type: hidden
              default: '@self.children'

            header.content.order.by:
              type: select
              label: Order By
              default: folder
              options:
                folder: Folder
                title: Title
                date: Date
                default: Default

            header.content.order.dir:
              type: select
              label: Order
              default: asc
              options:
                asc: Ascending
                desc: Descending

            header.cards_per_row:
              type: select
              label: Cards Per Row
              default: 2
              options:
                1: '1 (full width)'
                2: '2 per row'
                3: '3 per row'
              help: 'One per row on phones.'

            header.card_description_lines:
              type: select
              label: Description Line Limit
              default: 2
              options:
                0: 'No limit'
                2: '2 lines'
                3: '3 lines'

            header.side_box:
              type: textarea
              label: Side Box
              toggleable: true
              rows: 4
              help: 'Markdown under the module list, in place of the course''s Side Box (false hides it).'
