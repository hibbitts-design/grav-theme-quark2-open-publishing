title: Course Options
'@extends':
    type: default
    context: blueprints://pages

# A course's own page (course.md, as in Grav Helios Course Hub): its card on the Courses page, its home page, colour and course-wide settings.
# The same field names as Helios Course Hub, so a course moves between them unchanged. - hibbittsdesign.org
form:
  fields:
    tabs:
      type: tabs
      active: 1

      fields:
        content:
          fields:
            header.title:
              label: Course Title

        course:
          type: tab
          title: Course

          fields:

            course_info:
              type: display
              label: false
              markdown: true
              content: 'This page holds the course''s settings; its pages are the folders inside it.'

            header.description:
              type: textarea
              label: Course Card Description
              toggleable: true
              rows: 3
              help: 'Shown on the course''s card on the Courses page.'

            header.instructor:
              type: text
              label: Instructor(s)
              toggleable: true
              placeholder: 'e.g. Jane Smith or Jane Smith & John Doe'
              help: 'Shown on the course''s card.'

            header.image:
              type: pagemediaselect
              label: Course Card Image
              toggleable: true
              help: 'If empty, the course''s header image is used.'

            header.course_list_title:
              type: text
              label: Course Card Title
              toggleable: true
              help: 'If empty, the Course Title is used.'

            header.group:
              type: text
              label: Courses Page Group
              toggleable: true
              placeholder: 'e.g. Current Courses'
              help: 'Shows the course''s card under a heading with this name.'

            header.badge_label:
              type: text
              size: small
              label: Badge Label
              toggleable: true
              placeholder: 'e.g. Coming Soon, New, Archived'
              help: 'A short status badge on the course''s card.'

            header.badge_color:
              type: select
              label: Badge Color
              toggleable: true
              default: default
              options:
                default: Default
                blue: Blue
                green: Green
                yellow: Yellow
                red: Red
                purple: Purple
                plain: Plain

            header.hide_from_course_list:
              type: toggle
              label: Show on Courses Page
              default: 0
              highlight: 0
              options:
                0: PLUGIN_ADMIN.YES
                1: PLUGIN_ADMIN.NO
              validate:
                type: bool

            course_pages:
              type: section
              title: Course Pages
              underline: true

            header.course_home:
              type: text
              size: small
              label: Course Home Page
              toggleable: true
              placeholder: 'e.g. home'
              help: 'The folder name of the course''s home page. If empty, its first visible page.'

            header.course_site_title:
              type: text
              label: Course Name in Header
              toggleable: true
              help: 'If empty, the Course Title is used.'

            header.navbar_bg_color:
              type: colorpicker
              label: Course Color
              toggleable: true
              help: 'Tints the course navbar, as in Open Course Hub.'

            header.hide_header_image:
              type: toggle
              label: Show Header Image on Home Page
              default: 0
              highlight: 0
              options:
                0: PLUGIN_ADMIN.YES
                1: PLUGIN_ADMIN.NO
              validate:
                type: bool
              help: 'The image in the course''s headerimage folder, as a banner.'

            header.course_navbar_below_image:
              type: toggle
              label: Course Navbar Below Header Image
              default: 0
              highlight: 0
              options:
                1: PLUGIN_ADMIN.YES
                0: PLUGIN_ADMIN.NO
              validate:
                type: bool
              help: 'On the home page, the course navbar goes below the header image.'

            header.keep_my_place:
              type: toggle
              label: Keep My Place
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
              help: 'A "Continue reading" bar on the Modules page for returning readers.'

            header.show_search_box:
              type: toggle
              label: Show Search Box
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
              help: 'A search box beside the course''s pages that searches just this course.'

            header.side_box:
              type: textarea
              label: Side Box
              toggleable: true
              rows: 4
              help: 'Markdown shown under the module list on every module page.'

        # the same attribution settings as a guide's, shown at the bottom of the course's pages
        attribution:
          type: tab
          title: Attribution

          fields:

            header.show_oer_attribution:
              type: toggle
              label: Show OER Attribution Block
              highlight: 1
              default: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
              help: 'The attribution text and license at the bottom of every page in this course.'

            header.license:
              type: select
              label: License
              toggleable: true
              default: ''
              options:
                '': 'Not specified'
                'CC BY 4.0': 'CC BY 4.0 – Attribution'
                'CC BY-SA 4.0': 'CC BY-SA 4.0 – Attribution-ShareAlike'
                'CC BY-NC 4.0': 'CC BY-NC 4.0 – Attribution-NonCommercial'
                'CC BY-NC-SA 4.0': 'CC BY-NC-SA 4.0 – Attribution-NonCommercial-ShareAlike'
                'CC BY-ND 4.0': 'CC BY-ND 4.0 – Attribution-NoDerivatives'
                'CC BY-NC-ND 4.0': 'CC BY-NC-ND 4.0 – Attribution-NonCommercial-NoDerivatives'
              help: 'The course''s Creative Commons license.'

            header.license_url:
              type: text
              label: License URL
              toggleable: true
              placeholder: 'e.g. https://creativecommons.org/licenses/by/4.0/'
              help: 'Links the license. Leave empty for no link.'

            header.attribution_text:
              type: textarea
              label: Attribution Text
              toggleable: true
              rows: 3
              placeholder: 'e.g. This course by Jane Smith is licensed under CC BY 4.0.'
              help: 'The full attribution statement. Supports basic HTML.'

        # Hide from Menu comes from this theme's default.yaml; only its help text changes here (as for guides)
        advanced:
          fields:
            overrides:
              fields:
                header.hide_from_menu:
                  help: 'Leaves this course out of the site menu, but keeps its card on the Courses page.'
